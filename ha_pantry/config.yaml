name: HA-Pantry
version: "0.5.4"
slug: ha_pantry
description: Scanner-first front end for getting your pantry into Grocy
url: https://github.com/sakienvirotech/ha-pantry
# Prebuilt by .github/workflows/builder.yaml. Without this line the
# Supervisor builds the App on the device, as it did before 0.5.2.
image: ghcr.io/sakienvirotech/ha-pantry
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:barcode-scan
panel_title: Pantry
panel_admin: false
backup: cold
options:
  grocy_url: http://a0d7b954-grocy
  upcitemdb_fallback: false
schema:
  grocy_url: url
  grocy_api_key: password?
  upcitemdb_fallback: bool
